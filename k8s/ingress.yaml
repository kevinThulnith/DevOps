apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fms-prod-ingress
  namespace: fms-prod
  annotations:
    # Adjust maximum allowed upload body size (useful for file uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Timeout settings
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Automatically forces non-SSL (http) requests to redirect to secure HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limiting configuration to prevent local overload
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # Matches the local TLS secret created using mkcert
        - fms.prod.com
        - 192-168-8-134.nip.io # Add your IP here (eg: 192-168-8-134.nip.io)
        - cyborg2k24.local # Add your local hostname here (eg: karen.local)
      secretName: fms-tls-secret
  rules:
    - host: fms.prod.com
      http:
        paths: &paths
          - path: /
            pathType: Prefix
            backend:
              service:
                # Routes traffic directly to your reverse proxy setup
                name: fms-prod-proxy
                port:
                  number: 80
    - host: 192-168-8-134.nip.io
      http:
        paths: *paths
    - host: cyborg2k24.local
      http:
        paths: *paths
