name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_ENGINE: sqlite3
      DATABASE_NAME: db.sqlite3
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare Django log directory
        run: sudo mkdir -p /app/logs && sudo chown -R "$USER:$USER" /app

      - name: Run tests
        run: uv run python manage.py test --noinput

      - name: Run Django Checks
        run: uv run python manage.py check

      - name: Run Django Deploy Checks
        run: uv run python manage.py check --deploy

      - name: Run Django deploy checks with fail level
        run: uv run python manage.py check --deploy --fail-level=ERROR

  smoke-test:
    name: Smoke Test
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: docker compose build --pull

      - name: Start database and redis
        run: docker compose up -d fms-prod-database fms-prod-redis

      - name: Wait for database
        run: |
          set -e
          db_ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T fms-prod-database pg_isready -q; then
              db_ready=1
              break
            fi
            sleep 2
          done
          if [ "$db_ready" -ne 1 ]; then
            echo "Database didn't become ready in time"
            docker compose logs --no-color fms-prod-database || true
            exit 1
          fi

      - name: Django checks and migration
        run: |
          docker compose run --rm --no-deps fms-prod-backend sh -c "
            /app/.venv/bin/python manage.py check &&
            /app/.venv/bin/python manage.py check --deploy &&
            /app/.venv/bin/python manage.py check --deploy --fail-level=ERROR &&
            /app/.venv/bin/python manage.py migrate --noinput
          "

      - name: Start full stack
        run: docker compose up -d fms-prod-backend fms-prod-frontend fms-prod-proxy fms-prod-database fms-prod-redis

      - name: Wait for backend health
        run: |
          set -e
          backend_ready=0
          for i in $(seq 1 45); do
            if docker compose exec -T fms-prod-backend wget --quiet --tries=1 --spider http://127.0.0.1:8000/api/health/; then
              backend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo "Backend health check failed"
            docker compose ps
            docker compose logs --no-color fms-prod-backend || true
            exit 1
          fi

      - name: Wait for proxy health
        run: |
          set -e
          proxy_ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T fms-prod-proxy wget --quiet --tries=1 --spider http://127.0.0.1/health/; then
              proxy_ready=1
              break
            fi
            sleep 2
          done
          if [ "$proxy_ready" -ne 1 ]; then
            echo "Proxy health check failed"
            docker compose ps
            docker compose logs --no-color fms-prod-proxy fms-prod-backend || true
            exit 1
          fi
          echo "All health checks passed"

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color > compose.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down || true

      - name: Remove .env
        if: always()
        run: rm -f .env || true

  build-and-push:
    name: Build and Push Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fms-backend
            ghcr.io/${{ github.repository_owner }}/fms-backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-backend:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-backend:cache,mode=max

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fms-frontend
            ghcr.io/${{ github.repository_owner }}/fms-frontend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-frontend:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-frontend:cache,mode=max
          build-args: |
            VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}

      - name: Proxy image metadata
        id: proxy-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fms-proxy
            ghcr.io/${{ github.repository_owner }}/fms-proxy
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ steps.proxy-meta.outputs.tags }}
          labels: ${{ steps.proxy-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-proxy:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fms-proxy:cache,mode=max
