global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: django
    static_configs:
      - targets: ["fms-prod-backend:8000"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["fms-prod-redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["fms-prod-postgres-exporter:9187"]
